name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build backend
        run: mvn -B package -DskipTests
        working-directory: backend

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service deps
        run: pip install -r requirements.txt
        working-directory: ai-service

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: homebase
          POSTGRES_PASSWORD: homebase
          POSTGRES_DB: homebase
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run backend tests
        run: mvn -B test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/homebase
          SPRING_DATASOURCE_USERNAME: homebase
          SPRING_DATASOURCE_PASSWORD: homebase

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AI service tests
        run: pip install -r requirements.txt && pytest
        working-directory: ai-service

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests
        run: npm ci && npm run test:coverage
        working-directory: frontend

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Backend coverage report
        run: mvn -B verify jacoco:report -DskipTests=false
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/homebase

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint
        run: npm ci && npm run lint
        working-directory: frontend

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python lint (ruff)
        run: pip install ruff && ruff check .
        working-directory: ai-service

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: homebase
          POSTGRES_PASSWORD: homebase
          POSTGRES_DB: homebase
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Start backend
        run: mvn -B spring-boot:run -DskipTests &
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/homebase
          SPRING_DATASOURCE_USERNAME: homebase
          SPRING_DATASOURCE_PASSWORD: homebase
          JWT_SECRET: e2e-test-secret-must-be-at-least-32-chars!

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start frontend dev server
        run: npm ci && npm run dev &
        working-directory: frontend

      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: playwright

      - name: Wait for services
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8080/actuator/health && break
            echo "Waiting for backend... ($i)"
            sleep 5
          done
          for i in {1..20}; do
            curl -sf http://localhost:3000 && break
            echo "Waiting for frontend... ($i)"
            sleep 3
          done

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: playwright
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/homebase-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/homebase-backend:${{ github.sha }}
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/homebase-backend:${{ github.sha }} \
                     ${{ secrets.ACR_NAME }}.azurecr.io/homebase-backend:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/homebase-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/homebase-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/homebase-frontend:${{ github.sha }}

      - name: Build and push AI service image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/homebase-ai:${{ github.sha }} ./ai-service
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/homebase-ai:${{ github.sha }}

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: homebase-backend
          images: ${{ secrets.ACR_NAME }}.azurecr.io/homebase-backend:${{ github.sha }}

      - name: Deploy frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: homebase-frontend
          images: ${{ secrets.ACR_NAME }}.azurecr.io/homebase-frontend:${{ github.sha }}

      - name: Deploy AI service to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: homebase-ai-service
          images: ${{ secrets.ACR_NAME }}.azurecr.io/homebase-ai:${{ github.sha }}
